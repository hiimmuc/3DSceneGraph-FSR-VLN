/**:
  ros__parameters:
    relo:
        # priorDir: "/workspace/hts_demo_maps/ic5f_map/map"
        priorDir: "/workspace/hts_demo_maps/nianhui_map/map"
        cloudTopic: "/undistort_cloud"
        poseTopic: "/aft_mapped_to_init"
        searchDis: 1.0
        searchNum: 1  
        trustDis: 5.0
        localmap_res: 0.30 # local map voxel size
        currentcloud_res: 0.20  # current cloud voxel size
