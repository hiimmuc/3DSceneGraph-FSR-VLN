defaults:
    - _self_
    - profiles: custom # override with: profiles=ic3f | ic4f | ic7f | sh3f | custom

main:
    device: cuda
    llm_enable: false # true: enable LLM for query understanding + goal retrieval selection
    slow_reasoning: false # true: enable VLM slow-reasoning re-ranking (independent of llm_enable)
    graph_path: "" # path to a pre-built scene graph; override with main.graph_path=...
    spatial_reasoning_method: auto_region # auto_region | human_assign | none
    query_only: true # if true, only runs the query loop without visualization or ROS publishers
    verbose: false # true: show detailed timing/debug prints; false: quiet mode

hydra:
    job_logging:
        root:
            level: WARNING
        loggers:
            memory.hmsg:
                level: WARNING

models:
    clip:
        type: MobileCLIP2-S4 #ViT-L/14
        # checkpoint: checkpoints/open_clip_pytorch_model.bin
        checkpoint: checkpoints/mobileclip2_s4.pt
    sam:
        type: vit_h
        checkpoint: checkpoints/sam_vit_h_4b8939.pth
        points_per_side: 12
        pred_iou_thresh: 0.88
        points_per_batch: 144
        stability_score_thresh: 0.95
        crop_n_layers: 0
        min_mask_region_area: 100
