# Base configuration for the HoloAgent Streamlit UI (holoagent_app.py).
# Scene/system-specific values are in profiles/ — select with env var:
#   HOLOAGENT_PROFILE=custom  (default)
#
# Usage:
#   cd fsr_vln
#   streamlit run application/holoagent_app.py
#   HOLOAGENT_PROFILE=lab streamlit run application/holoagent_app.py

defaults:
    - profiles: custom

main:
    # Scene graph directory produced by semantic_scene_reconstruction.py
    graph_path: outputs/built_graphs/horizon/LivingRoomDataset_20260330/graph_20260402163619/

    # ROS2 camera topic for the live stream panel
    camera_topic: /camera/rgb

    # LLM query spec for navigation intent parsing
    long_query:
        spec: [obj, room, floor]

    # Scene graph query: number of top-k candidate objects to retrieve
    top_k: 3

    # Whether to use VLM for re-ranking retrieved objects
    use_vlm: false

    # Room name generation method: label | obj_embedding | view_embedding
    room_generation_method: label

    room_types:
        - living room
        - bedroom
        - kitchen
        - bathroom
        - dining room
        - office
        - storage room

    room_names_human_assign: []

    spatial_reasoning_method: auto_region
    fast_slow_method: fast_match

    # Save directory for navigation query session logs
    save_path: outputs/holoagent_sessions
    dataset: HoloAgent
    scene_id: LivingRoomDataset_20260330

ui:
    # Streamlit window layout
    left_panel_ratio: 8
    right_panel_ratio: 2

    # Camera stream auto-refresh interval in milliseconds
    camera_refresh_interval_ms: 500

    # Scene graph renderer image size (pixels)
    render_width: 960
    render_height: 720

audio:
    # STT: faster-whisper model size — tiny | base | small | medium | large-v2
    whisper_model_size: base
    # Device for STT inference: cpu | cuda
    whisper_device: cuda
    # Compute type: int8 (fast/CPU) | float16 (GPU) | float32
    whisper_compute_type: int8
    # Optional language hint for transcription (e.g. "en"). Empty = auto-detect.
    whisper_language: ""

    # TTS: path to the piper .onnx voice model file
    # Download: python3 -m piper.download_voices en_US-lessac-medium
    piper_voice_model: "en_US-lessac-medium"
    # Set to true to use GPU for TTS (requires onnxruntime-gpu)
    piper_use_cuda: true
