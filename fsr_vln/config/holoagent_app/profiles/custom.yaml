# @package _global_
# Custom profile — fill in your scene-specific paths below, or override via CLI:
#   HOLOAGENT_PROFILE=custom streamlit run application/holoagent_app.py

main:
    graph_path: outputs/built_graphs/horizon/LivingRoomDataset_20260330/graph_20260406170322/
    camera_topic: /camera/rgb
    save_path: outputs/holoagent_sessions
    dataset: custom
    scene_id: custom
    room_generation_method: obj_embedding
    room_types:
        - living room
        - bedroom
        - kitchen
        - bathroom
        - dining room
        - office
        - storage room

audio:
    whisper_model_size: base
    whisper_device: cuda
    whisper_compute_type: int8
    whisper_language: "en"
    piper_voice_model: "en_US-lessac-medium"
    piper_use_cuda: true
