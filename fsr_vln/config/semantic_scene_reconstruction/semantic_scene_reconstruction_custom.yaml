main:
    device: cuda
    use_gpt: false
    dataset: horizon #scannet # hm3dsem #replica #iphone
    scene_id: rosbag2_2026_03_26-14_12_50
    dataset_path: /home/namdp15/Workspace/VMO/vmo_scene_graph/3DSG_gen/data/HoloAgent
    # Depth threshold in meters — pixels/points beyond this distance are discarded; lower = only close objects reconstructed
    depth_cut: 1.0
    save_path: outputs/built_graphs
models:
    clip:
        type: ViT-L/14 # ViT-B-32 # ViT-H-14
        checkpoint: checkpoints/open_clip_pytorch_model.bin
    sam:
        checkpoint: checkpoints/sam_vit_h_4b8939.pth
        type: vit_h
        # Grid density for automatic mask generation — higher = more candidate masks, more compute
        points_per_side: 12
        # Minimum predicted IoU quality for a mask to be kept — higher = fewer but more confident masks
        pred_iou_thresh: 0.88
        points_per_batch: 144
        # Number of hierarchical crop layers — 0 disables cropping, higher captures small objects better
        crop_n_layers: 0
        # Filters unstable masks — higher = stricter, fewer masks
        stability_score_thresh: 0.95
        # Minimum pixel area for a mask — filters out tiny noise masks
        min_mask_region_area: 100
pipeline:
    # 3D spatial resolution in meters — smaller = finer detail but more memory/time
    voxel_size: 0.1 # default 0.05
    # Processes every Nth frame — higher = faster but may miss objects / should be match with skip + 1 in convert.yaml
    skip_frames: 5
    init_overlap_thresh: 0.85 # default 0.75
    # Scales init_overlap_thresh adaptively — controls how the threshold evolves
    overlap_thresh_factor: 0.025
    # Minimum 2D mask overlap to consider two detections as the same object
    iou_thresh: 0.05
    # Blend weight between masked-object CLIP features and full-image CLIP features — higher = more object-focused embeddings
    clip_masked_weight: 0.4418
    # Pixel padding around bounding boxes before CLIP encoding — larger margin includes more context
    clip_bbox_margin: 50 # in pixels
    # DBSCAN clustering radius in CLIP feature space — larger = more aggressive merging of similar objects
    feature_dbscan_eps: 0.01
    # Maximum 3D distance (meters) between masks to consider association — effectively a spatial cutoff
    max_mask_distance: 1000 # 6.4239 in meters
    # Minimum 3D points for an object to be kept in the graph — filters out spurious tiny reconstructions
    min_pcd_points: 100
    # When true, weights contributions by inverse depth (closer = more trusted)
    depth_weighting: false
    grid_resolution: 0.05
    # sequential merges frame-by-frame; hierarchical does multi-level merging — hierarchical is more thorough but slower
    merge_type: sequential # hierarchical
    save_intermediate_results: true
    obj_labels: IMAGENET21K_LABELS #FINALLABEL #SCANNET200 #COCO_STUFF_CLASSES #IMAGENET21K_LABELS #HM3DSEM_LABELS
    # When true, post-processes the graph to further merge duplicate object nodes
    merge_objects_graph: false
