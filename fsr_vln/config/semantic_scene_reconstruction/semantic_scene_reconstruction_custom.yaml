main:
    device: cuda
    use_vlm: false
    dataset: horizon
    scene_id: LivingRoomDataset_20260330
    dataset_path: /home/namdp15/Workspace/VMO/vm_scene_graph/vmo_scene_graph/3DSG_gen/data/HoloAgent
    # Depth threshold in meters — pixels/points beyond this distance are discarded; lower = only close objects reconstructed, depends on how far the camera to the objects
    depth_cut: 6.0
    save_path: outputs/built_graphs
models:
    clip:
        type: ViT-L/14 # ViT-B-32 # ViT-H-14
        checkpoint: checkpoints/open_clip_pytorch_model.bin
    sam:
        checkpoint: checkpoints/sam_vit_h_4b8939.pth
        type: vit_h
        # Grid density for automatic mask generation — higher = more candidate masks, more compute
        points_per_side: 12
        # Minimum predicted IoU quality for a mask to be kept — higher = fewer but more confident masks
        pred_iou_thresh: 0.88
        points_per_batch: 144
        # Number of hierarchical crop layers — 0 disables cropping, higher captures small objects better
        crop_n_layers: 0
        # Filters unstable masks — higher = stricter, fewer masks
        stability_score_thresh: 0.95
        # Minimum pixel area for a mask — filters out tiny noise masks
        min_mask_region_area: 100
pipeline:
    # 3D spatial resolution in meters — smaller = finer detail but more memory/time
    voxel_size: 0.05 # default 0.05

    # ========== Point Cloud Filtering Pipeline ==========
    # Multi-stage noise reduction for real RGB-D sensor data
    # Pipeline order: DBSCAN → Voxel downsample → Radius outlier removal
    # DBSCAN runs FIRST on the dense raw cloud where flying pixels are identifiable.
    # Voxel downsampling runs SECOND to reduce spatial density uniformly.
    # Radius outlier removal runs LAST to clean residual artifacts.
    enable_pcd_filtering: false

    # Stage 1: DBSCAN clustering — runs on the DENSE raw cloud to remove flying pixels
    # At raw density (~4M pts, avg spacing ~0.005m), eps=0.02 finds many neighbors.
    # min_points=10 is enough to distinguish real geometry from isolated noise.
    enable_dbscan_filtering: true
    dbscan_eps: 0.02
    dbscan_min_points: 10

    # Stage 2: Voxel downsampling — uniform density reduction after noise removal
    enable_voxel_downsampling: true

    # Stage 3: Radius outlier removal — final cleanup after downsampling
    enable_radius_outlier_filtering: true
    # Minimum neighbors in radius to keep a point
    radius_nb_points: 1000
    # Search radius (meters)
    radius_distance: 1.0

    # Visualization of the final full point cloud after filtering (cluster-colored, saved to save_path)
    # coloring_mode: 'depth' (blue=near, yellow=far), 'clusters' (each cluster different color), 'uniform' (red=before, green=after)
    coloring_mode: clusters # options: depth, clusters, uniform

    # Processes every Nth frame — higher = faster but may miss objects / should be match with skip + 1 in convert.yaml
    skip_frames: 5

    # ========== Mask Merging and Feature Extraction ==========

    init_overlap_thresh: 0.75 # default 0.75
    # Scales init_overlap_thresh adaptively — controls how the threshold evolves
    overlap_thresh_factor: 0.025
    # Minimum 2D mask overlap to consider two detections as the same object
    iou_thresh: 0.05
    # Blend weight between masked-object CLIP features and full-image CLIP features — higher = more object-focused embeddings
    clip_masked_weight: 0.4418
    # Pixel padding around bounding boxes before CLIP encoding — larger margin includes more context
    clip_bbox_margin: 50 # in pixels
    # Maximum 3D distance (meters) between masks to consider association — effectively a spatial cutoff
    max_mask_distance: 10000 # 6.4239 in meters
    grid_resolution: 0.05
    # sequential merges frame-by-frame; hierarchical does multi-level merging — hierarchical is more thorough but slower
    merge_type: hierarchical # hierarchical, sequential
    save_intermediate_results: true
    obj_labels: FINALLABEL #FINALLABEL #SCANNET200 #COCO_STUFF_CLASSES #IMAGENET21K_LABELS #HM3DSEM_LABELS
    # When true, post-processes the graph to further merge duplicate object nodes
    merge_objects_graph: true
