# convert.yaml
# Configuration for rosbag_2_dataset.py
# Edit this file and run:  python scripts/rosbag_2_dataset.py

# Path to the ROS2 bag directory (e.g. rosbag2_xxx/)
bag: ../../data/rosbag2_2026_03_26-14_12_50

# Output dataset directory (will be created if it does not exist)
output: ../../data/HoloAgent/rosbag2_2026_03_26-14_12_50

# Topics
rgb_topic: /zed/zed_node/rgb/color/rect/image
depth_topic: /zed/zed_node/depth/depth_registered
# Set to "" to skip auto-reading intrinsics from the bag and use fx/fy/cx/cy below
camera_info_topic: /zed/zed_node/depth/depth_registered/camera_info
# odom: /zed/zed_node/odom

# TF frames
tf_parent: odom
tf_child: zed_camera_link

# Fallback camera intrinsics (used when camera_info_topic is empty or unavailable)
fx: 744.18408203125
fy: 744.18408203125
cx: 924.4273681640625
cy: 561.051025390625
width: 1920
height: 1080

# Processing options
extrinsics:
    - [0, 0.0, 1.0, 0.0] # Rotated X-axis
    - [-1.0, 0.0, 0.0, 0.0] # Rotated Y-axis (Right)
    - [0.0, -1.0, 0.0, 0.0] # Z-axis (Vertical) stays the same
    - [0.0, 0.0, 0.0, 1.0]

# Save every (skip+1)-th RGB frame; 0 = save all frames
skip: 7
# Clip depth values above this threshold (millimetres)
max_depth_mm: 30000.0 # e.g. 5000 = 5 metres

# Max TF interpolation gap in seconds; frames outside this window get identity pose
max_interp_gap: 0.1
